openapi: 3.0.3

info:
  title: Merchant Service API
  description: >
    API za pretragu postojećih kompanija/merchanta i dohvat njihovih kontakata
    iz eksternog merchant/CRM sistema.

    Ovaj API predstavlja platform-neutralni middle layer model. Trenutna
    implementacija može koristiti Creatio ili neki drugi eksterni sistem kao izvor
    podataka, ali rute i response modeli ne zavise od konkretne platforme.

    Ovaj servis služi samo za čitanje postojećih podataka i automatsko
    popunjavanje onboarding forme. Spremanje onboarding prijave radi se kroz
    Onboarding Application API.
  version: 2.0.0

servers:
  - url: https://virtserver.swaggerhub.com/mon-7f4/merchant-service-api/2.0.0
    description: SwaggerHub API Auto Mocking

  - url: http://localhost:5000
    description: Lokalno razvojno okruženje

tags:
  - name: Merchants
    description: Pretraga i dohvat postojećih kompanija

  - name: Merchant Contacts
    description: Dohvat postojećih kontakata povezanih s kompanijom

paths:
  /api/v1/merchants/search:
    get:
      tags:
        - Merchants
      summary: Pretraži postojeće kompanije
      description: >
        Pretražuje postojeće kompanije prema nazivu kompanije,
        identifikacijskom broju, OIB-u, JIB-u, PDV broju ili drugom
        identifikatoru.

        Ruta čita podatke iz eksternog merchant/CRM sistema preko middle layera.
        Frontend ne zna koji je konkretan eksterni sistem izvor podataka.
      operationId: searchMerchants

      parameters:
        - name: query
          in: query
          required: true
          description: Naziv kompanije ili identifikacijski broj za pretragu.
          schema:
            type: string
            minLength: 3
          example: Monri

        - name: registrationCountry
          in: query
          required: false
          description: >
            Opcionalni ISO kod države registracije kompanije.
            Može se koristiti za sužavanje rezultata pretrage.
          schema:
            type: string
            minLength: 2
            maxLength: 2
          example: HR

        - name: limit
          in: query
          required: false
          description: Maksimalan broj rezultata pretrage.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          example: 10

      responses:
        "200":
          description: Kompanije su uspješno pronađene.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantSearchResponse"
              example:
                items:
                  - merchantId: "7d05319f-7b89-4e99-9fab-a3a83961e74d"
                    legalCompanyName: "Monri Payments d.o.o."
                    companyIdentificationNumber: "27746883608"
                    registrationCountry: "HR"
                    streetAndNumber: "Bani 75"
                    postalCode: "10010"
                    city: "Zagreb"
                totalCount: 1

        "400":
          description: Neispravni parametri pretrage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                status: 400
                message: "Parametar query mora sadržavati najmanje 3 znaka."
                traceId: null

        "500":
          description: Interna greška Merchant Servicea.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/merchants/{merchantId}:
    get:
      tags:
        - Merchants
      summary: Dohvati detalje postojeće kompanije
      description: >
        Dohvaća detaljne podatke postojeće kompanije iz eksternog merchant/CRM
        sistema.

        Podaci se koriste za automatsko popunjavanje koraka "Kompanija" u
        onboarding formi. Ako neki podatak ne postoji u eksternom sistemu,
        vraća se null i korisnik ga može dopuniti u onboarding prijavi.

        Ova ruta ne sprema niti ažurira onboarding prijavu.
      operationId: getMerchantById

      parameters:
        - $ref: "#/components/parameters/MerchantId"

      responses:
        "200":
          description: Kompanija je uspješno dohvaćena.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantDetails"
              example:
                merchantId: "7d05319f-7b89-4e99-9fab-a3a83961e74d"
                registrationCountry: "HR"
                legalCompanyName: "Monri Payments d.o.o."
                companyIdentificationNumber: "27746883608"
                vatNumber: "HR27746883608"
                streetAndNumber: "Bani 75"
                postalCode: "10010"
                city: "Zagreb"
                mainActivity: "Services"
                activityArea: "Information Technology"
                businessType: "B2B"
                webshopUrls:
                  - "https://monri.hr"
                  - "https://shop.monri.hr"
                webshopEmail: "info@monri.hr"
                webshopPhoneCountryCode: "+385"
                webshopPhoneNumber: "12345678"
                webSalesDescription: "Online prodaja proizvoda i usluga."
                dataCompleteness: "Partial"

        "400":
          description: Merchant ID nije u ispravnom formatu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Kompanija nije pronađena.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Interna greška Merchant Servicea.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/merchants/{merchantId}/contacts:
    get:
      tags:
        - Merchant Contacts
      summary: Dohvati postojeće kontakte kompanije
      description: >
        Dohvaća postojeće kontakt osobe povezane s kompanijom iz eksternog
        merchant/CRM sistema.

        Frontend može koristiti ove kontakte za automatsko popunjavanje kontakt
        sekcija u onboarding formi. Korisnik i dalje može izmijeniti podatke prije
        spremanja onboarding prijave.

        Ova ruta ne sprema kontakte u onboarding prijavu.
      operationId: getMerchantContacts

      parameters:
        - $ref: "#/components/parameters/MerchantId"

      responses:
        "200":
          description: Kontakti su uspješno dohvaćeni.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantContactListResponse"
              example:
                items:
                  - contactId: "3e3a7c3a-0e7e-4df4-9184-f4ec7b510001"
                    merchantId: "7d05319f-7b89-4e99-9fab-a3a83961e74d"
                    firstName: "Ana"
                    lastName: "Horvat"
                    positionFunction: "Direktor"
                    email: "ana.horvat@monri.hr"
                    phoneCountryCode: "+385"
                    phoneNumber: "912345678"

                  - contactId: "3e3a7c3a-0e7e-4df4-9184-f4ec7b510002"
                    merchantId: "7d05319f-7b89-4e99-9fab-a3a83961e74d"
                    firstName: "Nina"
                    lastName: "Kovačević"
                    positionFunction: "IT administrator"
                    email: "nina.kovacevic@monri.hr"
                    phoneCountryCode: "+385"
                    phoneNumber: "98111222"

                totalCount: 2

        "400":
          description: Merchant ID nije u ispravnom formatu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Kompanija nije pronađena.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Interna greška Merchant Servicea.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    MerchantId:
      name: merchantId
      in: path
      required: true
      description: >
        Platform-neutralni identifikator kompanije koji middle layer koristi za
        dohvat detalja iz eksternog merchant/CRM sistema.
      schema:
        type: string
        format: uuid
      example: "7d05319f-7b89-4e99-9fab-a3a83961e74d"

  schemas:
    MerchantSearchResponse:
      type: object
      required:
        - items
        - totalCount
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MerchantSearchItem"

        totalCount:
          type: integer
          minimum: 0
          description: Ukupan broj pronađenih kompanija.
          example: 1

    MerchantSearchItem:
      type: object
      required:
        - merchantId
        - legalCompanyName
        - companyIdentificationNumber
        - registrationCountry
      properties:
        merchantId:
          type: string
          format: uuid
          description: Platform-neutralni identifikator kompanije.
          example: "7d05319f-7b89-4e99-9fab-a3a83961e74d"

        legalCompanyName:
          type: string
          description: Pravni naziv kompanije.
          example: "Monri Payments d.o.o."

        companyIdentificationNumber:
          type: string
          description: Identifikacijski broj kompanije.
          example: "27746883608"

        registrationCountry:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO kod države registracije kompanije.
          example: "HR"

        streetAndNumber:
          type: string
          nullable: true
          description: Ulica i broj ulice.
          example: "Bani 75"

        postalCode:
          type: string
          nullable: true
          description: Poštanski broj.
          example: "10010"

        city:
          type: string
          nullable: true
          description: Grad.
          example: "Zagreb"

    MerchantDetails:
      type: object
      required:
        - merchantId
        - registrationCountry
        - legalCompanyName
        - companyIdentificationNumber
      properties:
        merchantId:
          type: string
          format: uuid
          description: Platform-neutralni identifikator kompanije.
          example: "7d05319f-7b89-4e99-9fab-a3a83961e74d"

        registrationCountry:
          type: string
          minLength: 2
          maxLength: 2
          description: Država registracije kompanije.
          example: "HR"

        legalCompanyName:
          type: string
          description: Pravni naziv kompanije.
          example: "Monri Payments d.o.o."

        companyIdentificationNumber:
          type: string
          description: Identifikacijski broj kompanije.
          example: "27746883608"

        vatNumber:
          type: string
          nullable: true
          description: PDV broj kompanije, ako postoji.
          example: "HR27746883608"

        streetAndNumber:
          type: string
          nullable: true
          description: Ulica i broj ulice.
          example: "Bani 75"

        postalCode:
          type: string
          nullable: true
          description: Poštanski broj.
          example: "10010"

        city:
          type: string
          nullable: true
          description: Grad.
          example: "Zagreb"

        mainActivity:
          type: string
          nullable: true
          description: Glavna djelatnost kompanije.
          example: "Services"

        activityArea:
          type: string
          nullable: true
          description: Područje djelatnosti kompanije.
          example: "Information Technology"

        businessType:
          type: string
          nullable: true
          description: Vrsta poslovanja.
          enum:
            - B2B
            - B2C
            - B2B2C
          example: "B2B"

        webshopUrls:
          type: array
          nullable: true
          maxItems: 5
          description: >
            Web adrese elektronskog prodajnog mjesta.
            Sekcija web prodajnog mjesta prikazuje se za sve proizvode.
          items:
            type: string
            format: uri
          example:
            - "https://monri.hr"
            - "https://shop.monri.hr"

        webshopEmail:
          type: string
          format: email
          nullable: true
          description: Webshop email adresa.
          example: "info@monri.hr"

        webshopPhoneCountryCode:
          type: string
          nullable: true
          description: Pozivni broj države za webshop telefon.
          example: "+385"

        webshopPhoneNumber:
          type: string
          nullable: true
          description: Webshop telefon bez pozivnog broja države.
          example: "12345678"

        webSalesDescription:
          type: string
          nullable: true
          description: Predmet web prodaje, odnosno opis proizvoda ili usluga koje se prodaju.
          example: "Online prodaja proizvoda i usluga."

        dataCompleteness:
          type: string
          description: >
            Informativni indikator potpunosti podataka dohvaćenih iz eksternog
            sistema. Frontend ga može koristiti interno, ali ga ne mora prikazivati
            korisniku.
          enum:
            - Complete
            - Partial
            - Unknown
          example: "Partial"

    MerchantContactListResponse:
      type: object
      required:
        - items
        - totalCount
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MerchantContact"

        totalCount:
          type: integer
          minimum: 0
          description: Ukupan broj kontakt osoba.
          example: 2

    MerchantContact:
      type: object
      required:
        - contactId
        - merchantId
        - firstName
        - lastName
      properties:
        contactId:
          type: string
          format: uuid
          description: Platform-neutralni identifikator kontakt osobe.
          example: "3e3a7c3a-0e7e-4df4-9184-f4ec7b510001"

        merchantId:
          type: string
          format: uuid
          description: Platform-neutralni identifikator kompanije.
          example: "7d05319f-7b89-4e99-9fab-a3a83961e74d"

        firstName:
          type: string
          description: Ime kontakt osobe.
          example: "Ana"

        lastName:
          type: string
          description: Prezime kontakt osobe.
          example: "Horvat"

        positionFunction:
          type: string
          nullable: true
          description: Pozicija ili funkcija kontakt osobe.
          example: "Direktor"

        email:
          type: string
          format: email
          nullable: true
          description: Email adresa kontakt osobe.
          example: "ana.horvat@monri.hr"

        phoneCountryCode:
          type: string
          nullable: true
          description: Pozivni broj države.
          example: "+385"

        phoneNumber:
          type: string
          nullable: true
          description: Kontakt telefon bez pozivnog broja države.
          example: "912345678"

    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          description: HTTP status kod.
          example: 400

        message:
          type: string
          description: Opis greške.
          example: "Poslani podaci nisu ispravni."

        traceId:
          type: string
          nullable: true
          description: Identifikator zahtjeva za praćenje greške.
          example: null