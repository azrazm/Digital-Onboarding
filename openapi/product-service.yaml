openapi: 3.0.3

info:
  title: Product Service API
  description: >
    API za dohvat dostupnih proizvoda koji se prikazuju u prvom koraku
    digitalnog onboarding procesa. Jedna prijava trenutno podržava odabir
    samo jednog proizvoda.
  version: 2.0.0

servers:
  - url: https://virtserver.swaggerhub.com/mon-7f4/product-service-api/2.0.0
    description: SwaggerHub API Auto Mocking

  - url: http://localhost:5001
    description: Lokalno razvojno okruženje

tags:
  - name: Products
    description: Dohvat proizvoda dostupnih za onboarding

paths:
  /api/v1/products:
    get:
      tags:
        - Products
      summary: Dohvati dostupne proizvode
      description: >
        Vraća listu proizvoda koje korisnik može odabrati u prvom koraku
        onboarding prijave.
      operationId: getProducts

      responses:
        "200":
          description: Lista proizvoda je uspješno dohvaćena.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
              example:
                items:
                  - productId: "INSTORE_PAYMENTS"
                    name: "Instore payments"
                    description: "Prihvat kartičnih plaćanja na fizičkim prodajnim mjestima."
                    icon: "store"
                    displayOrder: 1
                    status: "Active"

                  - productId: "ONLINE_PAYMENT"
                    name: "Online Payment"
                    description: "Prihvat online plaćanja za web trgovine i digitalne usluge."
                    icon: "globe"
                    displayOrder: 2
                    status: "Active"

                  - productId: "CASHIER_SYSTEM"
                    name: "Cashier System"
                    description: "Blagajničko rješenje za upravljanje prodajom i poslovanjem."
                    icon: "receipt"
                    displayOrder: 3
                    status: "Active"

                  - productId: "CASHLESS_SYSTEM"
                    name: "Cashless System"
                    description: "Cashless rješenje za zatvorene platne ekosisteme."
                    icon: "sparkles"
                    displayOrder: 4
                    status: "Active"

                totalCount: 4

        "500":
          description: Interna greška Product Servicea.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/products/{productId}:
    get:
      tags:
        - Products
      summary: Dohvati detalje proizvoda
      description: >
        Vraća osnovne detalje jednog proizvoda na osnovu njegovog ID-a.
      operationId: getProductById

      parameters:
        - $ref: "#/components/parameters/ProductId"

      responses:
        "200":
          description: Proizvod je uspješno pronađen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
              example:
                productId: "INSTORE_PAYMENTS"
                name: "Instore payments"
                description: "Prihvat kartičnih plaćanja na fizičkim prodajnim mjestima."
                icon: "store"
                displayOrder: 1
                status: "Active"

        "404":
          description: Proizvod nije pronađen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Interna greška Product Servicea.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      description: Jedinstveni identifikator proizvoda.
      schema:
        type: string
        enum:
          - INSTORE_PAYMENTS
          - ONLINE_PAYMENT
          - CASHIER_SYSTEM
          - CASHLESS_SYSTEM
      example: "INSTORE_PAYMENTS"

  schemas:
    ProductListResponse:
      type: object
      required:
        - items
        - totalCount
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"

        totalCount:
          type: integer
          minimum: 0
          example: 4

    Product:
      type: object
      required:
        - productId
        - name
        - displayOrder
        - status
      properties:
        productId:
          type: string
          description: Jedinstveni identifikator proizvoda.
          enum:
            - INSTORE_PAYMENTS
            - ONLINE_PAYMENT
            - CASHIER_SYSTEM
            - CASHLESS_SYSTEM
          example: "INSTORE_PAYMENTS"

        name:
          type: string
          description: Naziv proizvoda koji se prikazuje korisniku.
          example: "Instore payments"

        description:
          type: string
          nullable: true
          description: Kratki opis proizvoda.
          example: "Prihvat kartičnih plaćanja na fizičkim prodajnim mjestima."

        icon:
          type: string
          nullable: true
          description: Naziv ikone koju frontend može koristiti.
          example: "store"

        displayOrder:
          type: integer
          minimum: 1
          description: Redoslijed prikaza proizvoda.
          example: 1

        status:
          type: string
          description: Status proizvoda.
          enum:
            - Active
            - Inactive
          example: "Active"

    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          example: 500

        message:
          type: string
          example: "Došlo je do greške prilikom obrade zahtjeva."

        traceId:
          type: string
          nullable: true
          example: "00-6f9c1c2f6a2f4f7a9c1d4d1f0c4a7e12"