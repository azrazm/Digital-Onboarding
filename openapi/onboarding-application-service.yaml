openapi: 3.0.3

info:
  title: Onboarding Application Service API
  description: >
    API za kreiranje i dohvat digitalnih onboarding prijava.

    Ovaj servis predstavlja centralni middle layer za onboarding proces.
    Frontend šalje kompletnu prijavu nakon što korisnik prođe korake forme.

    Prijava trenutno podržava odabir jednog proizvoda.

    Dokumenti su opcionalni. Korisnik može preuzeti bankovni obrazac,
    popuniti ga i uploadovati, ali upload dokumenta ne blokira slanje prijave.

    Ako korisnik ne zna samostalno popuniti dokumentaciju, može odabrati opciju
    "Želim da me kontaktira Account Manager". U tom slučaju prijava se također
    sprema u sistem, a osnovne informacije iz prijave šalju se prodajnom timu
    putem notifikacije/emaila.
  version: 2.0.0

servers:
  - url: https://virtserver.swaggerhub.com/mon-7f4/onboarding-application-service/2.0.0
    description: SwaggerHub API Auto Mocking

  - url: http://localhost:5002
    description: Lokalno razvojno okruženje

tags:
  - name: Onboarding Applications
    description: Kreiranje i dohvat onboarding prijava

paths:
  /api/v1/onboarding-applications/submit:
    post:
      tags:
        - Onboarding Applications
      summary: Pošalji onboarding prijavu
      description: >
        Prima kompletnu onboarding prijavu i sprema je u sistem kao finalno
        poslanu prijavu.

        Za slanje prijave korisnik mora imati popunjene osnovne podatke,
        odabran proizvod, podatke o kompaniji, kontakt podatke i podatke o banci.

        U dijelu "Podaci o banci" korisnik mora odabrati banku ili eksplicitno
        odabrati opciju "Bez izbora trenutno".

        Upload popunjenih dokumenata nije obavezan i ne blokira slanje prijave.
      operationId: submitOnboardingApplication

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitOnboardingApplicationRequest"
            example:
              productId: "ONLINE_PAYMENT"

              company:
                sourceMerchantId: "7d05319f-7b89-4e99-9fab-a3a83961e74d"
                registrationCountry: "HR"
                legalCompanyName: "Monri Payments d.o.o."
                companyIdentificationNumber: "27746883608"
                vatNumber: "HR27746883608"
                streetAndNumber: "Zmaja od Bosne 4"
                postalCode: "71000"
                city: "Sarajevo"
                mainActivity: "Services"
                activityArea: "Services_it"
                businessType: "B2B"
                webshopUrls:
                  - "https://monri.hr"
                  - "https://drugi-webshop.hr"
                webshopEmail: "info@monri.hr"
                webshopPhoneCountryCode: "+385"
                webshopPhoneNumber: "12345678"
                webSalesDescription: "Online prodaja proizvoda i usluga."

              contacts:
                - contactType: "COMPANY_REPRESENTATIVE"
                  firstName: "Ana"
                  lastName: "Horvat"
                  positionFunction: "Direktor"
                  email: "ana.horvat@monri.hr"
                  phoneCountryCode: "+385"
                  phoneNumber: "912345678"

                - contactType: "AUTHORIZED_REPRESENTATIVE"
                  firstName: "Emir"
                  lastName: "Salihović"
                  positionFunction: "Vlasnik"
                  email: "emir.salihovic@primjer.ba"
                  phoneCountryCode: "+385"
                  phoneNumber: "61765432"

                - contactType: "TECHNICAL_CONTACT"
                  firstName: "Nina"
                  lastName: "Kovačević"
                  phoneCountryCode: "+385"
                  phoneNumber: "62119988"
                  testEnvironmentEmails:
                    - "nina.kovacevic@primjer.ba"
                  webPlatformType: "WooCommerce"

              bankData:
                bankSelectionType: "SELECTED_BANK"
                bankId: "RAIFFEISEN_BANKA"
                bankName: "Raiffeisen banka"
                estimatedMonthlyCardTransactionVolumeKm: 50000
                estimatedMonthlyCardTransactionCount: 1200

              documents:
                - documentId: "8f8d8c1f-7d3e-45ad-9e2f-0c1c0f2e0001"
                  bankId: "RAIFFEISEN_BANKA"
                  templateId: "RBA_EVALUATION_FORM"
                  documentName: "Raiffeisen banka - Obrazac za evaluaciju"
                  originalFileName: "popunjen-obrazac-za-evaluaciju.xlsx"
                  dmsDocumentReference: "DMS-2026-000123"

              confirmedReview: true
              submittedByEmail: "ana.horvat@monri.hr"

      responses:
        "201":
          description: Onboarding prijava je uspješno poslana.
          headers:
            Location:
              description: URL kreirane onboarding prijave.
              schema:
                type: string
                example: "/api/v1/onboarding-applications/5f3f1f6d-1b82-4c47-9d42-2ab78f1c0001"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingApplicationDetails"
              example:
                applicationId: "5f3f1f6d-1b82-4c47-9d42-2ab78f1c0001"
                applicationNumber: "ONB-2026-000001"
                applicationStatus: "SUBMITTED"
                submissionType: "STANDARD_SUBMISSION"
                submittedAt: "2026-07-29T13:20:00Z"
                lastUpdatedAt: "2026-07-29T13:20:00Z"
                accountManagerContactRequested: false
                salesNotificationStatus: "NotRequired"
                confirmedReview: true
                submittedByEmail: "ana.horvat@monri.hr"
                productId: "ONLINE_PAYMENT"
                company:
                  sourceMerchantId: "7d05319f-7b89-4e99-9fab-a3a83961e74d"
                  registrationCountry: "HR"
                  legalCompanyName: "Monri Payments d.o.o."
                  companyIdentificationNumber: "27746883608"
                  vatNumber: "HR27746883608"
                  streetAndNumber: "Zmaja od Bosne 4"
                  postalCode: "71000"
                  city: "Sarajevo"
                  mainActivity: "Services"
                  activityArea: "Services_it"
                  businessType: "B2B"
                  webshopUrls:
                    - "https://monri.hr"
                    - "https://drugi-webshop.hr"
                  webshopEmail: "info@monri.hr"
                  webshopPhoneCountryCode: "+385"
                  webshopPhoneNumber: "12345678"
                  webSalesDescription: "Online prodaja proizvoda i usluga."
                contacts:
                  - contactType: "COMPANY_REPRESENTATIVE"
                    firstName: "Ana"
                    lastName: "Horvat"
                    positionFunction: "Direktor"
                    email: "ana.horvat@monri.hr"
                    phoneCountryCode: "+385"
                    phoneNumber: "912345678"
                bankData:
                  bankSelectionType: "SELECTED_BANK"
                  bankId: "RAIFFEISEN_BANKA"
                  bankName: "Raiffeisen banka"
                  estimatedMonthlyCardTransactionVolumeKm: 50000
                  estimatedMonthlyCardTransactionCount: 1200
                documents:
                  - documentId: "8f8d8c1f-7d3e-45ad-9e2f-0c1c0f2e0001"
                    bankId: "RAIFFEISEN_BANKA"
                    templateId: "RBA_EVALUATION_FORM"
                    documentName: "Raiffeisen banka - Obrazac za evaluaciju"
                    originalFileName: "popunjen-obrazac-za-evaluaciju.xlsx"
                    dmsDocumentReference: "DMS-2026-000123"

        "400":
          description: Poslani podaci nisu ispravni.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "409":
          description: Onboarding prijava nije validna zbog poslovnog pravila.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingBankChoice:
                  summary: Nije odabrana banka niti opcija bez izbora
                  value:
                    status: 409
                    message: "Potrebno je odabrati banku ili opciju 'Bez izbora trenutno'."
                    traceId: null

                missingReviewConfirmation:
                  summary: Nije potvrđen pregled podataka
                  value:
                    status: 409
                    message: "Korisnik mora potvrditi da je pregledao podatke prije slanja."
                    traceId: null

        "500":
          description: Interna greška Onboarding Application Servicea.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/onboarding-applications/request-account-manager-contact:
    post:
      tags:
        - Onboarding Applications
      summary: Zatraži kontakt Account Managera
      description: >
        Prima kompletnu onboarding prijavu i sprema je u sistem sa oznakom da
        korisnik želi pomoć Account Managera.

        Ova ruta se koristi kada klijent ne zna samostalno popuniti dokumentaciju
        ili ima pitanja/nejasnoće.

        Nakon uspješnog kreiranja prijave, sistem šalje notifikaciju/email
        prodajnom timu s osnovnim informacijama iz prijave kako bi mogli
        kontaktirati klijenta.

        Upload popunjenog dokumenta nije obavezan.
      operationId: requestAccountManagerContact

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestAccountManagerContactRequest"
            example:
              productId: "ONLINE_PAYMENT"

              company:
                sourceMerchantId: "7d05319f-7b89-4e99-9fab-a3a83961e74d"
                registrationCountry: "HR"
                legalCompanyName: "Monri Payments d.o.o."
                companyIdentificationNumber: "27746883608"
                vatNumber: "HR27746883608"
                streetAndNumber: "Zmaja od Bosne 4"
                postalCode: "71000"
                city: "Sarajevo"
                mainActivity: "Services"
                activityArea: "Services_it"
                businessType: "B2B"
                webshopUrls:
                  - "https://monri.hr"
                webshopEmail: "info@monri.hr"
                webshopPhoneCountryCode: "+385"
                webshopPhoneNumber: "12345678"
                webSalesDescription: "Online prodaja proizvoda i usluga."

              contacts:
                - contactType: "COMPANY_REPRESENTATIVE"
                  firstName: "Ana"
                  lastName: "Horvat"
                  positionFunction: "Direktor"
                  email: "ana.horvat@monri.hr"
                  phoneCountryCode: "+385"
                  phoneNumber: "912345678"

                - contactType: "AUTHORIZED_REPRESENTATIVE"
                  firstName: "Emir"
                  lastName: "Salihović"
                  positionFunction: "Vlasnik"
                  email: "emir.salihovic@primjer.ba"
                  phoneCountryCode: "+385"
                  phoneNumber: "61765432"

                - contactType: "TECHNICAL_CONTACT"
                  firstName: "Nina"
                  lastName: "Kovačević"
                  phoneCountryCode: "+385"
                  phoneNumber: "62119988"
                  testEnvironmentEmails:
                    - "nina.kovacevic@primjer.ba"
                  webPlatformType: "WooCommerce"

              bankData:
                bankSelectionType: "SELECTED_BANK"
                bankId: "RAIFFEISEN_BANKA"
                bankName: "Raiffeisen banka"
                estimatedMonthlyCardTransactionVolumeKm: 50000
                estimatedMonthlyCardTransactionCount: 1200

              documents: []

              contactRequest:
                reason: "DOCUMENT_SUPPORT"
                message: "Klijent treba pomoć oko popunjavanja bankovne dokumentacije."

              submittedByEmail: "ana.horvat@monri.hr"

      responses:
        "201":
          description: Prijava je kreirana i zahtjev za kontakt Account Managera je evidentiran.
          headers:
            Location:
              description: URL kreirane onboarding prijave.
              schema:
                type: string
                example: "/api/v1/onboarding-applications/5f3f1f6d-1b82-4c47-9d42-2ab78f1c0001"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingApplicationDetails"
              example:
                applicationId: "5f3f1f6d-1b82-4c47-9d42-2ab78f1c0001"
                applicationNumber: "ONB-2026-000002"
                applicationStatus: "SUBMITTED"
                submissionType: "ACCOUNT_MANAGER_CONTACT_REQUEST"
                submittedAt: "2026-07-29T13:25:00Z"
                lastUpdatedAt: "2026-07-29T13:25:00Z"
                accountManagerContactRequested: true
                salesNotificationStatus: "Sent"
                confirmedReview: false
                submittedByEmail: "ana.horvat@monri.hr"
                productId: "ONLINE_PAYMENT"
                company:
                  sourceMerchantId: "7d05319f-7b89-4e99-9fab-a3a83961e74d"
                  registrationCountry: "HR"
                  legalCompanyName: "Monri Payments d.o.o."
                  companyIdentificationNumber: "27746883608"
                  vatNumber: "HR27746883608"
                  streetAndNumber: "Zmaja od Bosne 4"
                  postalCode: "71000"
                  city: "Sarajevo"
                  mainActivity: "Services"
                  activityArea: "Services_it"
                  businessType: "B2B"
                  webshopUrls:
                    - "https://monri.hr"
                  webshopEmail: "info@monri.hr"
                  webshopPhoneCountryCode: "+385"
                  webshopPhoneNumber: "12345678"
                  webSalesDescription: "Online prodaja proizvoda i usluga."
                contacts:
                  - contactType: "COMPANY_REPRESENTATIVE"
                    firstName: "Ana"
                    lastName: "Horvat"
                    positionFunction: "Direktor"
                    email: "ana.horvat@monri.hr"
                    phoneCountryCode: "+385"
                    phoneNumber: "912345678"
                bankData:
                  bankSelectionType: "SELECTED_BANK"
                  bankId: "RAIFFEISEN_BANKA"
                  bankName: "Raiffeisen banka"
                  estimatedMonthlyCardTransactionVolumeKm: 50000
                  estimatedMonthlyCardTransactionCount: 1200
                documents: []
                contactRequest:
                  reason: "DOCUMENT_SUPPORT"
                  message: "Klijent treba pomoć oko popunjavanja bankovne dokumentacije."

        "400":
          description: Poslani podaci nisu ispravni.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "409":
          description: Prijava nije validna zbog poslovnog pravila.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Interna greška Onboarding Application Servicea.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/onboarding-applications/{applicationId}:
    get:
      tags:
        - Onboarding Applications
      summary: Dohvati onboarding prijavu
      description: >
        Dohvaća kompletnu onboarding prijavu na osnovu internog identifikatora.
        Koristi se za pregled poslane prijave ili interni prikaz u sistemu.
      operationId: getOnboardingApplicationById

      parameters:
        - $ref: "#/components/parameters/ApplicationId"

      responses:
        "200":
          description: Onboarding prijava je uspješno pronađena.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingApplicationDetails"

        "400":
          description: Application ID nije u ispravnom UUID formatu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Onboarding prijava nije pronađena.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Interna greška Onboarding Application Servicea.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: Interni identifikator onboarding prijave.
      schema:
        type: string
        format: uuid
      example: "5f3f1f6d-1b82-4c47-9d42-2ab78f1c0001"

  schemas:
    SubmitOnboardingApplicationRequest:
      type: object
      required:
        - productId
        - company
        - contacts
        - bankData
        - confirmedReview
      properties:
        productId:
          $ref: "#/components/schemas/ProductId"

        company:
          $ref: "#/components/schemas/ApplicationCompany"

        contacts:
          type: array
          minItems: 3
          maxItems: 3
          description: >
            Finalna lista kontakt osoba iz onboarding forme.
            Očekuju se tri kontakt uloge: predstavnik kompanije,
            ovlašteni zastupnik i tehnički kontakt.
          items:
            $ref: "#/components/schemas/ApplicationContact"

        bankData:
          $ref: "#/components/schemas/ApplicationBankData"

        documents:
          type: array
          nullable: true
          description: >
            Opcionalne reference na uploadovane dokumente.
            Upload dokumenta nije obavezan.
          items:
            $ref: "#/components/schemas/ApplicationDocument"

        confirmedReview:
          type: boolean
          description: Potvrda da je korisnik pregledao podatke prije slanja.
          example: true

        submittedByEmail:
          type: string
          format: email
          nullable: true
          description: Email osobe koja je poslala onboarding prijavu.
          example: "ana.horvat@monri.hr"

    RequestAccountManagerContactRequest:
      type: object
      required:
        - productId
        - company
        - contacts
        - bankData
        - contactRequest
      properties:
        productId:
          $ref: "#/components/schemas/ProductId"

        company:
          $ref: "#/components/schemas/ApplicationCompany"

        contacts:
          type: array
          minItems: 3
          maxItems: 3
          description: >
            Finalna lista kontakt osoba iz onboarding forme.
            Očekuju se tri kontakt uloge: predstavnik kompanije,
            ovlašteni zastupnik i tehnički kontakt.
          items:
            $ref: "#/components/schemas/ApplicationContact"

        bankData:
          $ref: "#/components/schemas/ApplicationBankData"

        documents:
          type: array
          nullable: true
          description: >
            Opcionalne reference na uploadovane dokumente.
            Upload dokumenta nije obavezan.
          items:
            $ref: "#/components/schemas/ApplicationDocument"

        contactRequest:
          $ref: "#/components/schemas/AccountManagerContactRequest"

        submittedByEmail:
          type: string
          format: email
          nullable: true
          description: Email osobe koja traži kontakt Account Managera.
          example: "ana.horvat@monri.hr"

    ProductId:
      type: string
      description: Jedinstveni identifikator odabranog proizvoda.
      enum:
        - INSTORE_PAYMENTS
        - ONLINE_PAYMENT
        - CASHIER_SYSTEM
        - CASHLESS_SYSTEM
      example: "ONLINE_PAYMENT"

    ApplicationCompany:
      type: object
      required:
        - registrationCountry
        - legalCompanyName
        - companyIdentificationNumber
        - streetAndNumber
        - postalCode
        - city
        - mainActivity
        - webshopUrls
      properties:
        sourceMerchantId:
          type: string
          format: uuid
          nullable: true
          description: >
            ID postojeće kompanije ako je korisnik odabrao kompaniju iz pretrage.
            Može biti null ako se unosi nova kompanija.
          example: "7d05319f-7b89-4e99-9fab-a3a83961e74d"

        registrationCountry:
          type: string
          minLength: 2
          maxLength: 2
          description: Država registracijske kompanije.
          example: "HR"

        legalCompanyName:
          type: string
          description: Pravni naziv kompanije.
          example: "Monri Payments d.o.o."

        companyIdentificationNumber:
          type: string
          description: Identifikacijski broj kompanije.
          example: "27746883608"

        vatNumber:
          type: string
          nullable: true
          description: PDV broj kompanije.
          example: "HR27746883608"

        streetAndNumber:
          type: string
          description: Ulica i broj ulice.
          example: "Zmaja od Bosne 4"

        postalCode:
          type: string
          description: Poštanski broj.
          example: "71000"

        city:
          type: string
          description: Grad.
          example: "Sarajevo"

        mainActivity:
          type: string
          description: Glavna djelatnost.
          example: "Services"

        activityArea:
          type: string
          nullable: true
          description: Područje djelatnosti.
          example: "Services_it"

        businessType:
          type: string
          nullable: true
          description: Vrsta poslovanja.
          enum:
            - B2B
            - B2C
            - B2B2C
          example: "B2B"

        webshopUrls:
          type: array
          minItems: 1
          maxItems: 5
          description: Web adrese elektronskog prodajnog mjesta.
          items:
            type: string
            format: uri
          example:
            - "https://monri.hr"
            - "https://drugi-webshop.hr"

        webshopEmail:
          type: string
          format: email
          nullable: true
          description: Webshop email adresa.
          example: "info@monri.hr"

        webshopPhoneCountryCode:
          type: string
          nullable: true
          description: Pozivni broj države za webshop telefon.
          example: "+385"

        webshopPhoneNumber:
          type: string
          nullable: true
          description: Webshop telefon bez pozivnog broja države.
          example: "12345678"

        webSalesDescription:
          type: string
          nullable: true
          description: Predmet web prodaje, odnosno opis proizvoda ili usluga.
          example: "Online prodaja proizvoda i usluga."

    ApplicationContact:
      type: object
      required:
        - contactType
        - firstName
        - lastName
        - phoneCountryCode
        - phoneNumber
      properties:
        contactType:
          type: string
          description: Tip kontakt osobe u onboarding prijavi.
          enum:
            - COMPANY_REPRESENTATIVE
            - AUTHORIZED_REPRESENTATIVE
            - TECHNICAL_CONTACT
          example: "COMPANY_REPRESENTATIVE"

        firstName:
          type: string
          description: Ime kontakt osobe.
          example: "Ana"

        lastName:
          type: string
          description: Prezime kontakt osobe.
          example: "Horvat"

        positionFunction:
          type: string
          nullable: true
          description: Pozicija ili funkcija kontakt osobe.
          example: "Direktor"

        email:
          type: string
          format: email
          nullable: true
          description: Email adresa kontakt osobe.
          example: "ana.horvat@monri.hr"

        phoneCountryCode:
          type: string
          description: Pozivni broj države.
          example: "+385"

        phoneNumber:
          type: string
          description: Kontakt telefon bez pozivnog broja države.
          example: "912345678"

        testEnvironmentEmails:
          type: array
          nullable: true
          maxItems: 5
          description: >
            Email adrese za pristup testnom okruženju.
            Primarno se koristi za tehnički kontakt.
          items:
            type: string
            format: email
          example:
            - "nina.kovacevic@primjer.ba"

        webPlatformType:
          type: string
          nullable: true
          description: Tip web platforme.
          example: "WooCommerce"

    ApplicationBankData:
      type: object
      required:
        - bankSelectionType
        - estimatedMonthlyCardTransactionVolumeKm
        - estimatedMonthlyCardTransactionCount
      properties:
        bankSelectionType:
          type: string
          description: >
            Označava da li je korisnik odabrao banku ili trenutno nema izbor banke.
          enum:
            - SELECTED_BANK
            - NO_BANK_SELECTED
          example: "SELECTED_BANK"

        bankId:
          type: string
          nullable: true
          description: >
            Identifikator odabrane banke.
            Obavezan je kada je bankSelectionType = SELECTED_BANK.
            Mora biti null kada je bankSelectionType = NO_BANK_SELECTED.
          example: "RAIFFEISEN_BANKA"

        bankName:
          type: string
          nullable: true
          description: Naziv odabrane banke za prikaz.
          example: "Raiffeisen banka"

        estimatedMonthlyCardTransactionVolumeKm:
          type: number
          format: decimal
          description: Procijenjeni mjesečni volumen kartičnih transakcija u KM.
          example: 50000

        estimatedMonthlyCardTransactionCount:
          type: integer
          minimum: 0
          description: Procijenjeni mjesečni broj kartičnih transakcija.
          example: 1200

    ApplicationDocument:
      type: object
      required:
        - documentId
        - bankId
        - templateId
        - documentName
        - originalFileName
      properties:
        documentId:
          type: string
          format: uuid
          description: Interni ID dokumenta koji je vratio Document Service.
          example: "8f8d8c1f-7d3e-45ad-9e2f-0c1c0f2e0001"

        bankId:
          type: string
          description: Identifikator banke za koju je dokument uploadovan.
          example: "RAIFFEISEN_BANKA"

        templateId:
          type: string
          description: Identifikator obrasca na osnovu kojeg je dokument popunjen.
          example: "RBA_EVALUATION_FORM"

        documentName:
          type: string
          description: Naziv dokumenta.
          example: "Raiffeisen banka - Obrazac za evaluaciju"

        originalFileName:
          type: string
          description: Originalni naziv uploadovanog fajla.
          example: "popunjen-obrazac-za-evaluaciju.xlsx"

        dmsDocumentReference:
          type: string
          nullable: true
          description: Referenca dokumenta u DMS-u.
          example: "DMS-2026-000123"

    AccountManagerContactRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Razlog zbog kojeg korisnik traži kontakt Account Managera.
          enum:
            - DOCUMENT_SUPPORT
            - BANK_INFORMATION_SUPPORT
            - GENERAL_SUPPORT
          example: "DOCUMENT_SUPPORT"

        message:
          type: string
          nullable: true
          description: Dodatna poruka korisnika ili sistemska napomena.
          example: "Klijent treba pomoć oko popunjavanja bankovne dokumentacije."

    OnboardingApplicationDetails:
      type: object
      required:
        - applicationId
        - applicationNumber
        - applicationStatus
        - submissionType
        - submittedAt
        - lastUpdatedAt
        - productId
        - company
        - contacts
        - bankData
      properties:
        applicationId:
          type: string
          format: uuid
          description: Interni identifikator onboarding prijave.
          example: "5f3f1f6d-1b82-4c47-9d42-2ab78f1c0001"

        applicationNumber:
          type: string
          description: Korisnički čitljiv broj onboarding prijave.
          example: "ONB-2026-000001"

        applicationStatus:
          type: string
          description: Status onboarding prijave.
          enum:
            - SUBMITTED
            - PROCESSING
            - COMPLETED
            - FAILED
          example: "SUBMITTED"

        submissionType:
          type: string
          description: Tip slanja prijave.
          enum:
            - STANDARD_SUBMISSION
            - ACCOUNT_MANAGER_CONTACT_REQUEST
          example: "STANDARD_SUBMISSION"

        submittedAt:
          type: string
          format: date-time
          description: Vrijeme slanja prijave.
          example: "2026-07-29T13:20:00Z"

        lastUpdatedAt:
          type: string
          format: date-time
          description: Vrijeme zadnje izmjene prijave.
          example: "2026-07-29T13:20:00Z"

        submittedByEmail:
          type: string
          format: email
          nullable: true
          description: Email osobe koja je poslala prijavu.
          example: "ana.horvat@monri.hr"

        confirmedReview:
          type: boolean
          nullable: true
          description: Potvrda da je korisnik pregledao podatke prije standardnog slanja.
          example: true

        accountManagerContactRequested:
          type: boolean
          description: Označava da li je korisnik zatražio kontakt Account Managera.
          example: false

        salesNotificationStatus:
          type: string
          description: Status slanja notifikacije/emaila prodajnom timu.
          enum:
            - NotRequired
            - Pending
            - Sent
            - Failed
          example: "NotRequired"

        productId:
          $ref: "#/components/schemas/ProductId"

        company:
          $ref: "#/components/schemas/ApplicationCompany"

        contacts:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationContact"

        bankData:
          $ref: "#/components/schemas/ApplicationBankData"

        documents:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ApplicationDocument"

        contactRequest:
          $ref: "#/components/schemas/AccountManagerContactRequest"

    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          description: HTTP status kod.
          example: 400

        message:
          type: string
          description: Opis nastale greške.
          example: "Poslani podaci nisu ispravni."

        traceId:
          type: string
          nullable: true
          description: Identifikator zahtjeva za praćenje greške.
          example: null