openapi: 3.0.3

info:
  title: Document Service API
  description: >
    API za dohvat bankovnih obrazaca za download i upload popunjenih dokumenata
    tokom digitalnog onboarding procesa.

    Dokumenti za download zavise od odabrane banke. Korisnik može preuzeti
    obrazac, popuniti ga i opciono uploadovati popunjenu verziju.

    Upload popunjenog dokumenta trenutno nije obavezan.

    Servis je zamišljen kao DMS adapter boundary. U prototipu može koristiti
    lokalni/mock storage, a kasnije se implementacija može zamijeniti pravom
    DMS integracijom.
  version: 2.0.0

servers:
  - url: http://localhost:5003
    description: Lokalno razvojno okruženje

tags:
  - name: Document Templates
    description: Dohvat obrazaca dostupnih za preuzimanje

  - name: Uploaded Documents
    description: Upload i dohvat metapodataka popunjenih dokumenata

paths:
  /api/v1/document-templates:
    get:
      tags:
        - Document Templates
      summary: Dohvati obrasce za odabranu banku
      description: >
        Vraća listu obrazaca koje korisnik može preuzeti na osnovu odabrane banke.
        Obrasci su povezani s bankom i prikazuju se u koraku "Podaci o banci".

        Upload popunjenih obrazaca nije obavezan.
      operationId: getDocumentTemplates

      parameters:
        - name: bankId
          in: query
          required: true
          description: Identifikator odabrane banke.
          schema:
            type: string
          example: RAIFFEISEN_BANKA

      responses:
        "200":
          description: Lista obrazaca je uspješno dohvaćena.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentTemplateListResponse"
              example:
                bankId: "RAIFFEISEN_BANKA"
                bankName: "Raiffeisen banka"
                items:
                  - templateId: "RBA_EVALUATION_FORM"
                    bankId: "RAIFFEISEN_BANKA"
                    documentName: "Raiffeisen banka - Obrazac za evaluaciju"
                    description: "Obrazac za evaluaciju potrebno je vratiti u istom Excel formatu."
                    fileName: "raiffeisen-obrazac-za-evaluaciju.xlsx"
                    contentType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                    uploadAllowed: true
                    uploadRequired: false
                    displayOrder: 1

                  - templateId: "RBA_EPAY_REQUEST"
                    bankId: "RAIFFEISEN_BANKA"
                    documentName: "Raiffeisen banka - Zahtjev za EPAY"
                    description: "Zahtjev za EPAY potrebno je popuniti, potpisati i ovjeriti ako je primjenjivo."
                    fileName: "raiffeisen-zahtjev-za-epay.pdf"
                    contentType: "application/pdf"
                    uploadAllowed: true
                    uploadRequired: false
                    displayOrder: 2

                totalCount: 2

        "400":
          description: Neispravni parametri zahtjeva.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "404":
          description: Za odabranu banku nisu pronađeni obrasci.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Interna greška Document Servicea.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/document-templates/{templateId}/download:
    get:
      tags:
        - Document Templates
      summary: Preuzmi obrazac
      description: >
        Vraća fizički sadržaj obrasca za download.

        Obrazac je unaprijed povezan s bankom i prikazuje se korisniku nakon
        odabira banke.

        Ruta vraća binarni sadržaj dokumenta, npr. PDF ili Excel dokument.
      operationId: downloadDocumentTemplate

      parameters:
        - $ref: "#/components/parameters/TemplateId"

      responses:
        "200":
          description: Obrazac je uspješno dohvaćen.
          content:
            application/pdf:
              schema:
                type: string
                format: binary

            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary

        "404":
          description: Obrazac nije pronađen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Interna greška Document Servicea.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/documents/upload:
    post:
      tags:
        - Uploaded Documents
      summary: Upload popunjenog dokumenta
      description: >
        Prima popunjeni dokument koji je korisnik prethodno preuzeo, popunio i
        odlučio uploadovati.

        Upload popunjenog dokumenta trenutno nije obavezan. Ako korisnik uploaduje
        dokument, servis čuva datoteku ili je prosljeđuje DMS-u, a vraća samo
        metapodatke i referencu dokumenta.

        Dokument se povezuje s onboarding prijavom, odabranom bankom i template
        dokumentom iz kojeg je nastao.
      operationId: uploadCompletedDocument

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadCompletedDocumentRequest"

      responses:
        "201":
          description: Dokument je uspješno uploadovan.
          headers:
            Location:
              description: URL metapodataka uploadovanog dokumenta.
              schema:
                type: string
                example: "/api/v1/documents/8f8d8c1f-7d3e-45ad-9e2f-0c1c0f2e0001"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedDocumentDetails"
              example:
                documentId: "8f8d8c1f-7d3e-45ad-9e2f-0c1c0f2e0001"
                applicationId: "b30bbfe1-a28d-4736-a66a-9060c770be9d"
                bankId: "RAIFFEISEN_BANKA"
                templateId: "RBA_EVALUATION_FORM"
                documentName: "Raiffeisen banka - Obrazac za evaluaciju"
                originalFileName: "popunjen-obrazac-za-evaluaciju.xlsx"
                contentType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                fileSizeBytes: 245760
                uploadStatus: "Uploaded"
                dmsDocumentReference: "DMS-2026-000123"
                uploadedAt: "2026-07-29T09:30:00Z"

        "400":
          description: Poslani dokument nije ispravan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidContentType:
                  summary: Neispravan content type
                  value:
                    status: 400
                    message: "Dozvoljeni formati su PDF, Excel, Word, PNG i JPEG."
                    traceId: null

                fileTooLarge:
                  summary: Dokument je prevelik
                  value:
                    status: 400
                    message: "Dokument ne smije biti veći od 10 MB."
                    traceId: null

        "404":
          description: Onboarding prijava, banka ili obrazac nisu pronađeni.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Interna greška Document Servicea.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/documents/{documentId}:
    get:
      tags:
        - Uploaded Documents
      summary: Dohvati metapodatke uploadovanog dokumenta
      description: >
        Dohvaća metapodatke uploadovanog dokumenta.

        Ruta ne vraća fizički sadržaj dokumenta, nego samo informacije potrebne
        za prikaz i vezu s DMS-om.
      operationId: getUploadedDocumentById

      parameters:
        - $ref: "#/components/parameters/DocumentId"

      responses:
        "200":
          description: Dokument je uspješno pronađen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedDocumentDetails"
              example:
                documentId: "8f8d8c1f-7d3e-45ad-9e2f-0c1c0f2e0001"
                applicationId: "b30bbfe1-a28d-4736-a66a-9060c770be9d"
                bankId: "RAIFFEISEN_BANKA"
                templateId: "RBA_EVALUATION_FORM"
                documentName: "Raiffeisen banka - Obrazac za evaluaciju"
                originalFileName: "popunjen-obrazac-za-evaluaciju.xlsx"
                contentType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
                fileSizeBytes: 245760
                uploadStatus: "Uploaded"
                dmsDocumentReference: "DMS-2026-000123"
                uploadedAt: "2026-07-29T09:30:00Z"

        "404":
          description: Dokument nije pronađen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Interna greška Document Servicea.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    TemplateId:
      name: templateId
      in: path
      required: true
      description: Jedinstveni identifikator obrasca za download.
      schema:
        type: string
      example: "RBA_EVALUATION_FORM"

    DocumentId:
      name: documentId
      in: path
      required: true
      description: Interni identifikator uploadovanog dokumenta.
      schema:
        type: string
        format: uuid
      example: "8f8d8c1f-7d3e-45ad-9e2f-0c1c0f2e0001"

  schemas:
    DocumentTemplateListResponse:
      type: object
      required:
        - bankId
        - items
        - totalCount
      properties:
        bankId:
          type: string
          description: Identifikator banke za koju se dohvaćaju obrasci.
          example: "RAIFFEISEN_BANKA"

        bankName:
          type: string
          nullable: true
          description: Naziv banke za prikaz korisniku.
          example: "Raiffeisen banka"

        items:
          type: array
          description: Lista obrazaca dostupnih za download.
          items:
            $ref: "#/components/schemas/DocumentTemplate"

        totalCount:
          type: integer
          minimum: 0
          description: Ukupan broj obrazaca.
          example: 2

    DocumentTemplate:
      type: object
      required:
        - templateId
        - bankId
        - documentName
        - fileName
        - contentType
        - uploadAllowed
        - uploadRequired
        - displayOrder
      properties:
        templateId:
          type: string
          description: Jedinstveni identifikator obrasca.
          example: "RBA_EVALUATION_FORM"

        bankId:
          type: string
          description: Identifikator banke kojoj obrazac pripada.
          example: "RAIFFEISEN_BANKA"

        documentName:
          type: string
          description: Naziv dokumenta koji se prikazuje korisniku.
          example: "Raiffeisen banka - Obrazac za evaluaciju"

        description:
          type: string
          nullable: true
          description: Dodatno objašnjenje za korisnika.
          example: "Svi podaci u tabeli su mandatorni i dokument se vraća u istom Excel formatu."

        fileName:
          type: string
          description: Naziv fajla koji se preuzima.
          example: "raiffeisen-obrazac-za-evaluaciju.xlsx"

        contentType:
          type: string
          description: MIME tip obrasca.
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
          example: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

        uploadAllowed:
          type: boolean
          description: Označava da li korisnik može uploadovati popunjenu verziju ovog obrasca.
          example: true

        uploadRequired:
          type: boolean
          description: >
            Označava da li je upload popunjenog dokumenta obavezan.
            Prema trenutnom mockupu upload nije obavezan.
          example: false

        displayOrder:
          type: integer
          minimum: 1
          description: Redoslijed prikaza dokumenta u UI-u.
          example: 1

    UploadCompletedDocumentRequest:
      type: object
      required:
        - applicationId
        - bankId
        - templateId
        - file
      properties:
        applicationId:
          type: string
          format: uuid
          description: Identifikator onboarding prijave kojoj dokument pripada.
          example: "b30bbfe1-a28d-4736-a66a-9060c770be9d"

        bankId:
          type: string
          description: Identifikator banke za koju je dokument uploadovan.
          example: "RAIFFEISEN_BANKA"

        templateId:
          type: string
          description: Identifikator obrasca na osnovu kojeg je dokument popunjen.
          example: "RBA_EVALUATION_FORM"

        file:
          type: string
          format: binary
          description: Popunjeni dokument koji korisnik uploaduje.

    UploadedDocumentDetails:
      type: object
      required:
        - documentId
        - applicationId
        - bankId
        - templateId
        - documentName
        - originalFileName
        - contentType
        - uploadStatus
        - uploadedAt
      properties:
        documentId:
          type: string
          format: uuid
          description: Interni identifikator uploadovanog dokumenta.
          example: "8f8d8c1f-7d3e-45ad-9e2f-0c1c0f2e0001"

        applicationId:
          type: string
          format: uuid
          description: Identifikator onboarding prijave.
          example: "b30bbfe1-a28d-4736-a66a-9060c770be9d"

        bankId:
          type: string
          description: Identifikator banke.
          example: "RAIFFEISEN_BANKA"

        templateId:
          type: string
          description: Identifikator obrasca koji je korisnik popunio.
          example: "RBA_EVALUATION_FORM"

        documentName:
          type: string
          description: Naziv dokumenta koji se prikazuje korisniku.
          example: "Raiffeisen banka - Obrazac za evaluaciju"

        originalFileName:
          type: string
          description: Originalni naziv uploadovanog fajla.
          example: "popunjen-obrazac-za-evaluaciju.xlsx"

        contentType:
          type: string
          description: MIME tip uploadovanog dokumenta.
          example: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

        fileSizeBytes:
          type: integer
          nullable: true
          minimum: 0
          description: Veličina fajla u bajtovima.
          example: 245760

        uploadStatus:
          type: string
          description: Status uploadovanog dokumenta.
          enum:
            - Uploaded
            - Failed
          example: "Uploaded"

        dmsDocumentReference:
          type: string
          nullable: true
          description: >
            Referenca dokumenta u DMS-u. Frontend je može čuvati kao metapodatak,
            ali je ne mora prikazivati korisniku.
          example: "DMS-2026-000123"

        uploadedAt:
          type: string
          format: date-time
          description: Vrijeme uploadovanja dokumenta.
          example: "2026-07-29T09:30:00Z"

    ErrorResponse:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: integer
          description: HTTP status kod.
          example: 400

        message:
          type: string
          description: Opis greške.
          example: "Poslani podaci nisu ispravni."

        traceId:
          type: string
          nullable: true
          description: Identifikator zahtjeva za praćenje greške.
          example: null